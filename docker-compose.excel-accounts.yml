# Use after the normal compose file AND docker-compose.excel.yml.
services:
  codex2api:
    environment:
      EXCEL_ROUTES_FILE: /run/excel-routes/routes.json
      EXCEL_BRIDGE_URL: http://excel-bridge:8000
      EXCEL_BRIDGE_API_KEY: ${EXCEL_BRIDGE_API_KEY:?Set EXCEL_BRIDGE_API_KEY}
    volumes:
      - type: bind
        source: ${EXCEL_SESSION_DIR:?Set EXCEL_SESSION_DIR}
        target: /run/excel-routes
        read_only: true
        bind:
          create_host_path: false
  excel-bridge:
    environment:
      EXCEL_ACCOUNT_ROUTES: "1"
