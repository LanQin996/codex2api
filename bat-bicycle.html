<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>月光骑行 · 蝙蝠的夜游</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 28px; background: #101421; color: #eeeaf8; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; }
  main { width: min(1100px, 100%); }
  header { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 24px; }
  .eyebrow { color: #a9a4bf; font-size: 11px; letter-spacing: 4px; }
  h1 { margin: 10px 0 0; font-size: clamp(24px, 4vw, 38px); font-weight: 500; letter-spacing: 3px; }
  .tag { border: 1px solid #444256; border-radius: 30px; padding: 9px 15px; font-size: 12px; color: #c5c0d8; white-space: nowrap; }
  .scene { overflow: hidden; border-radius: 24px; border: 1px solid #393548; background: #211e38; box-shadow: 0 30px 80px #0004; }
  svg { display: block; width: 100%; height: auto; }
  footer { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding-top: 22px; }
  .caption { color: #b0acc1; font-size: 13px; line-height: 1.8; margin: 0; }
  .controls { display: flex; align-items: center; flex-wrap: wrap; gap: 16px; }
  button { background: #d3c4fb; border: 0; border-radius: 24px; color: #28213d; padding: 12px 22px; min-width: 100px; font: inherit; font-size: 13px; cursor: pointer; }
  button:hover { background: #e2d7ff; }
  button:focus-visible, input:focus-visible { outline: 3px solid #efbd85; outline-offset: 5px; }
  label { display: flex; align-items: center; gap: 10px; font-size: 12px; color: #c5c0d8; }
  input { width: 100px; accent-color: #d3c4fb; }
  output { min-width: 30px; font-variant-numeric: tabular-nums; }
  @media(max-width: 600px) { body { padding: 18px; } header { align-items: flex-start; } .tag { font-size: 10px; padding: 7px 10px; } footer { flex-direction: column; align-items: flex-start; } .scene { border-radius: 16px; } }
</style>
</head>
<body>
<main>
  <header><div><div class="eyebrow">LITTLE NIGHT ADVENTURES</div><h1>月光骑行</h1></div><span class="tag">SVG · 2D 动画</span></header>
  <div class="scene">
    <svg id="scene" viewBox="0 0 1100 620" role="img" aria-labelledby="scene-title scene-desc">
      <title id="scene-title">一只小蝙蝠在月光下骑自行车</title>
      <desc id="scene-desc">紫色蝙蝠戴着珊瑚色围巾，踩着薄荷绿自行车穿过山林。车轮旋转，翅膀轻摆，星光闪烁，背景缓缓后退。</desc>
      <defs>
        <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#211e39"/><stop offset="1" stop-color="#5b456b"/></linearGradient>
        <linearGradient id="wing" x2="0" y2="1"><stop stop-color="#a08acb"/><stop offset="1" stop-color="#615388"/></linearGradient>
        <linearGradient id="body" x2="1" y2="1"><stop stop-color="#a99ace"/><stop offset="1" stop-color="#73628f"/></linearGradient>
        <radialGradient id="halo"><stop stop-color="#f9e8ba" stop-opacity=".17"/><stop offset="1" stop-color="#f9e8ba" stop-opacity="0"/></radialGradient>
        <g id="pine"><path d="M0 0 30 58H16L43 100H23L53 148H-53L-23 100H-43L-16 58H-30Z"/><path d="M-5 130H5V180H-5Z"/></g>
        <g id="wheel">
          <circle r="74" fill="#242535" stroke="#171e2a" stroke-width="12"/>
          <circle r="67" fill="none" stroke="#b7c7c5" stroke-width="3"/>
          <g class="spokes" stroke="#899aab" stroke-width="1.7">
            <path d="M-65 0H65M0-65V65M-46-46 46 46M-46 46 46-46M-60-25 60 25M-25-60 25 60M-60 25 60-25M-25 60 25-60"/>
            <path d="M-54-35-47-40" stroke="#f5cf89" stroke-width="5" stroke-linecap="round"/>
          </g>
          <circle r="8" fill="#d5ddda"/>
        </g>
      </defs>
      <path fill="url(#sky)" d="M0 0H1100V620H0Z"/>
      <circle cx="848" cy="129" r="145" fill="url(#halo)"/>
      <circle cx="848" cy="129" r="49" fill="#f6e6bb"/>
      <g fill="#ddcfa9" opacity=".5"><circle cx="869" cy="107" r="10"/><circle cx="829" cy="146" r="13"/><circle cx="871" cy="146" r="6"/></g>
      <g id="stars" fill="#f4dfbe"></g>
      <g opacity=".17" fill="#d2bbd9"><path d="M64 171Q77 149 111 161Q129 131 160 155Q190 149 201 171Z"/><path d="M595 109Q609 88 634 99Q654 73 677 100Q705 94 716 109Z"/></g>
      <g id="mountains" fill="#423b59"></g>
      <g id="hills" fill="#35354e"></g>
      <g id="trees" fill="#282f44"></g>
      <path d="M0 498Q230 478 510 496T1100 486V620H0Z" fill="#242b3b"/>
      <path d="M0 528H1100" stroke="#9c8c9e" stroke-opacity=".34" stroke-width="2"/>
      <g id="road" stroke="#b8a6b9" stroke-width="3" stroke-linecap="round" opacity=".35"></g>
      <ellipse cx="558" cy="529" rx="224" ry="15" fill="#121c2b" opacity=".55"/>
      <g id="rider">
        <!-- The far leg sits behind the bicycle frame. -->
        <path id="leg-back" fill="none" stroke="#62537e" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/>
        <g transform="translate(405 445)"><use href="#wheel"/></g>
        <g transform="translate(698 445)"><use href="#wheel"/></g>
        <g stroke-linecap="round" stroke-linejoin="round" fill="none">
          <path d="M405 445 474 341 550 445H405L474 341H657L550 445M657 341 698 445" stroke="#20283a" stroke-width="15"/>
          <path d="M405 445 474 341 550 445H405L474 341H657L550 445M657 341 698 445" stroke="#86c8b7" stroke-width="8"/>
          <path d="M474 341 462 312M657 341 644 297 673 281" stroke="#c3d6d0" stroke-width="7"/>
          <path d="M442 311H482" stroke="#30293f" stroke-width="13"/>
          <path d="M672 281H692" stroke="#30293f" stroke-width="9"/>
          <path d="M675 285Q705 315 682 351" stroke="#b0b9bd" stroke-width="2"/>
        </g>
        <circle cx="550" cy="445" r="22" fill="#334354" stroke="#b2ccc4" stroke-width="3"/>
        <g id="crank" stroke="#d4ded8" stroke-width="5" stroke-linecap="round"><path d="M-25 0H25"/></g>
        <g id="bat">
          <path id="wing-left" d="M515 268Q448 196 340 220Q380 242 365 275Q402 261 419 302Q451 278 486 319L525 292Z" fill="url(#wing)" stroke="#413654" stroke-width="4" stroke-linejoin="round"/>
          <path d="M514 275 373 229M514 278 420 292" fill="none" stroke="#c2aade" stroke-opacity=".45" stroke-width="2"/>
          <path id="wing-right" d="M570 264Q596 203 651 200Q633 229 658 252Q626 246 624 278Q600 264 588 300Z" fill="#736091" stroke="#413654" stroke-width="4" stroke-linejoin="round"/>
          <path d="M494 282Q478 314 490 341Q518 362 555 341Q580 311 569 275Z" fill="url(#body)" stroke="#413654" stroke-width="4"/>
          <ellipse cx="533" cy="315" rx="24" ry="30" fill="#c2addb" opacity=".6"/>
          <path d="M490 208 479 144Q483 130 495 143L529 181M558 179 593 139Q602 131 602 149L594 213" fill="#9280b5" stroke="#413654" stroke-width="5" stroke-linejoin="round"/>
          <path d="M492 157 501 196 518 185M588 155 569 185 590 196" fill="#d79cba"/>
          <path d="M487 206Q497 180 539 181Q584 179 599 209Q616 250 579 273Q540 296 503 272Q473 253 487 206Z" fill="url(#body)" stroke="#413654" stroke-width="4"/>
          <g id="eyes">
            <ellipse cx="522" cy="225" rx="14" ry="18" fill="#f8eedd"/><ellipse cx="569" cy="223" rx="14" ry="18" fill="#f8eedd"/>
            <ellipse cx="527" cy="226" rx="7" ry="11" fill="#2b263e"/><ellipse cx="574" cy="224" rx="7" ry="11" fill="#2b263e"/>
            <g fill="white"><circle cx="529" cy="221" r="3"/><circle cx="576" cy="219" r="3"/></g>
          </g>
          <g fill="#df9ab2" opacity=".65"><ellipse cx="506" cy="247" rx="11" ry="6"/><ellipse cx="588" cy="243" rx="10" ry="6"/></g>
          <path d="m542 241 8 0-4 6Z" fill="#49364e"/>
          <path d="M531 254Q547 268 565 252" fill="#49364e" stroke="#49364e" stroke-width="2" stroke-linecap="round"/>
          <path d="m534 256 3 9 5-6M556 258l5 5 2-9" fill="#fff2dc"/>
          <path id="scarf-tail" d="M514 280Q457 267 416 296L425 307 412 322Q467 303 521 298Z" fill="#e78c8c" stroke="#af626f" stroke-width="2"/>
          <path d="M503 274Q540 291 575 271L575 286Q539 305 504 290Z" fill="#f0a094" stroke="#bc707f" stroke-width="2"/>
          <path d="M564 297Q608 327 675 283" fill="none" stroke="#413654" stroke-width="17" stroke-linecap="round"/>
          <path d="M564 297Q608 327 675 283" fill="none" stroke="#9c8abd" stroke-width="11" stroke-linecap="round"/>
          <path d="M674 279q13-7 15 2l-2 8" fill="none" stroke="#b6a0ce" stroke-width="6" stroke-linecap="round"/>
        </g>
        <path id="leg-front" fill="none" stroke="#ab95c6" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
        <g id="pedals" fill="#303043"></g>
      </g>
      <g fill="#81948a" opacity=".6"><path d="m74 551-7-17 14 12 8-24-1 28ZM955 573l-11-20 17 13 7-28 2 35Z"/></g>
      <text x="47" y="584" fill="#b4a8c2" font-family="monospace" font-size="11" letter-spacing="3">NO WINGS NEEDED TONIGHT.</text>
    </svg>
  </div>
  <footer>
    <p class="caption">今晚不飞，骑车去追月亮。<br>让晚风吹起围巾，慢慢穿过这片星光。</p>
    <div class="controls">
      <button id="toggle" type="button" aria-pressed="false">暂停动画</button>
      <label for="speed">骑行速度 <input id="speed" type="range" min="0.5" max="2" value="1" step="0.25"><output id="speed-value" for="speed">1×</output></label>
    </div>
  </footer>
</main>
<script>
(() => {
  "use strict";
  const $ = id => document.getElementById(id);
  const ns = "http://www.w3.org/2000/svg";
  function add(parent, tag, attrs) {
    const el = document.createElementNS(ns, tag);
    Object.entries(attrs).forEach(([key, value]) => el.setAttribute(key, value));
    parent.appendChild(el);
    return el;
  }
  // Deterministic scenery; no external assets or libraries.
  let seed = 23;
  function random() { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }
  const stars = Array.from({ length: 42 }, () => add($("stars"), "circle", {
    cx: 35 + random() * 1030, cy: 28 + random() * 270, r: .8 + random() * 1.6
  }));
  function repeatedLandscape(id, path) {
    for (let i = 0; i < 3; i++) add($(id), "path", { d: path, transform: `translate(${i * 1100} 0)` });
  }
  repeatedLandscape("mountains", "M0 415V382L125 259 243 370 377 246 552 393 724 282 890 364 1015 275 1100 382V500H0Z");
  repeatedLandscape("hills", "M0 431Q140 348 292 420T550 421T825 414T1100 431V510H0Z");
  for (let i = 0; i < 24; i++) {
    const x = i * 105, scale = .45 + random() * .5;
    add($("trees"), "use", { href: "#pine", transform: `translate(${x} ${496 - 180 * scale}) scale(${scale})` });
  }
  for (let i = 0; i < 16; i++) add($("road"), "path", { d: `M${i * 95} ${548 + i % 3 * 12}h${20 + i % 4 * 9}` });
  const pedalFront = add($("pedals"), "rect", { width: 29, height: 8, rx: 4 });
  const pedalBack = add($("pedals"), "rect", { width: 29, height: 8, rx: 4 });
  const spokes = document.querySelectorAll(".spokes");
  let playing = !matchMedia("(prefers-reduced-motion: reduce)").matches;
  let speed = 1, time = 0, last = null;
  function setButton() {
    $("toggle").textContent = playing ? "暂停动画" : "播放动画";
    $("toggle").setAttribute("aria-pressed", String(!playing));
  }
  $("toggle").addEventListener("click", () => { playing = !playing; setButton(); });
  $("speed").addEventListener("input", e => {
    speed = Number(e.target.value);
    $("speed-value").value = `${speed}×`;
  });
  function draw(t) {
    const angle = t * 3.3, degrees = angle * 180 / Math.PI;
    const px = 550 + Math.cos(angle) * 25, py = 445 + Math.sin(angle) * 25;
    const bx = 1100 - px, by = 890 - py;
    spokes.forEach(el => el.setAttribute("transform", `rotate(${degrees})`));
    $("crank").setAttribute("transform", `translate(550 445) rotate(${degrees})`);
    $("leg-front").setAttribute("d", `M529 340Q${580 + Math.cos(angle) * 12} 377 ${px} ${py}`);
    $("leg-back").setAttribute("d", `M511 338Q${490 - Math.cos(angle) * 12} 385 ${bx} ${by}`);
    pedalFront.setAttribute("transform", `translate(${px - 14} ${py - 3})`);
    pedalBack.setAttribute("transform", `translate(${bx - 14} ${by - 3})`);
    $("bat").setAttribute("transform", `translate(0 ${Math.sin(angle * 2) * 2})`);
    $("wing-left").setAttribute("transform", `rotate(${Math.sin(angle) * 3} 515 278)`);
    $("wing-right").setAttribute("transform", `rotate(${-Math.sin(angle) * 4} 575 278)`);
    $("scarf-tail").setAttribute("transform", `rotate(${Math.sin(t * 6) * 4} 514 284)`);
    $("eyes").setAttribute("transform", t % 5.7 > 5.53 ? "translate(0 225) scale(1 .1) translate(0 -225)" : "");
    $("mountains").setAttribute("transform", `translate(${-t * 9 % 1100} 0)`);
    $("hills").setAttribute("transform", `translate(${-t * 20 % 1100} 0)`);
    $("trees").setAttribute("transform", `translate(${-t * 42 % 1155} 0)`);
    $("road").setAttribute("transform", `translate(${-t * 150 % 285} 0)`);
    stars.forEach((star, i) => star.setAttribute("opacity", .35 + .65 * (1 + Math.sin(t * 1.5 + i * 1.7)) / 2));
  }
  function frame(now) {
    if (last !== null && playing && !document.hidden) time += Math.min((now - last) / 1000, .05) * speed;
    last = now;
    draw(time);
    requestAnimationFrame(frame);
  }
  setButton();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
