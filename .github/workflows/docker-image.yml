name: Build Docker Image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_version:
        description: 'Version label shown in the admin UI, e.g. 2.0.6'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: docker-image-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Prepare image name and build version
        id: image
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.build_version }}
        run: |
          set -euo pipefail
          echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          version="${REQUESTED_VERSION:-}"
          if [[ -z "$version" ]]; then
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              version="$GITHUB_REF_NAME"
            else
              version="sha-${GITHUB_SHA:0:7}"
            fi
          fi
          if [[ ! "$version" =~ ^[a-zA-Z0-9][a-zA-Z0-9._+-]{0,127}$ ]]; then
            echo "::error::Invalid build_version: use 1-128 letters, digits, dots, underscores, plus signs or hyphens."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        if: github.event_name != 'pull_request'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha
            type=semver,pattern={{version}},value=${{ steps.image.outputs.version }},enable=${{ inputs.build_version != '' || startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.image.outputs.version }},enable=${{ inputs.build_version != '' || startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=latest,enable=${{ github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_VERSION=${{ steps.image.outputs.version }}
            GOPROXY=${{ vars.DOCKER_GOPROXY || 'https://goproxy.cn,direct' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
